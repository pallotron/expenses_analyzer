name: Deploy

# Ship the Worker when a change to it reaches main: test, migrate D1, deploy.
# Docs-only and Python-only merges leave production alone.
on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # The same checks as the PR, re-run on exactly what is being shipped.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Schema and migrations agree
        run: |
          npx drizzle-kit generate
          git diff --exit-code drizzle/

      # D1 Time Travel can restore any minute of the last 7 days (30 on paid).
      # Logging the bookmark first puts the exact undo command in this run.
      - name: Record the pre-deploy restore point
        run: npx wrangler d1 time-travel info expenses

      - name: Pending migrations
        run: npx wrangler d1 migrations list expenses --remote

      # Before the new code goes out, so it never runs against an old schema.
      # Migrations must therefore keep the previous Worker working too
      # (add columns and tables; drop them in a later deploy).
      - name: Apply migrations
        run: npx wrangler d1 migrations apply expenses --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      # Access redirects an anonymous request to its login page, so a 302 to
      # cloudflareaccess.com proves the hostname is up and still protected.
      - name: Still behind Access
        run: |
          location=$(curl -s -o /dev/null -w '%{redirect_url}' https://expenses.angelofailla.com/api/me)
          case "$location" in
            https://pallotron.cloudflareaccess.com/*) echo "protected by Access" ;;
            *) echo "expected an Access login redirect, got: '$location'"; exit 1 ;;
          esac
