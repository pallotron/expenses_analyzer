# .github/workflows/tests.yml
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  worker:
    name: Worker Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Includes the proof that each query module returns exactly what its
      # src/queries/sql/ reference SQL file returns.
      - name: Test
        run: npm test

      # Regenerating must be a no-op. If it is not, schema.ts changed without a
      # matching migration, and anything seeded from drizzle/ would drift from
      # the schema the Worker compiles against.
      - name: Schema and migrations agree
        run: |
          npx drizzle-kit generate
          git diff --exit-code drizzle/
