name = "expenses-analyzer-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Served only on the custom domain, which the Access application protects.
# workers.dev is off: it would be a second address with no Access in front.
# Top-level keys must stay above the first [table] header, or TOML files them
# under that table.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "expenses.angelofailla.com", custom_domain = true }
]

# The frontend build, served by this Worker on the same origin. run_worker_first
# sends every request, static files included, through getUser; an unknown path
# gets index.html so client-side routes survive a reload.
[assets]
directory = "../frontend/dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

# Created with `npx wrangler d1 create expenses`. Apply drizzle/*.sql in order,
# then seed with tools/dump_for_d1.sh (not `sqlite3 .dump`, which D1 rejects).
[[d1_databases]]
binding = "DB"
database_name = "expenses"
database_id = "ce692cdd-1d7f-4eba-8f36-b8ec6e1b285b"
migrations_dir = "drizzle"

# Cloudflare Access sits in front of this Worker and supplies a signed JWT.
# CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD identify the Access application whose
# token the Worker verifies; neither is a secret, but both are per-deployment.
[vars]
CF_ACCESS_TEAM_DOMAIN = "pallotron.cloudflareaccess.com"
CF_ACCESS_AUD = "af6e9c488346fcaf590728ed831f2adbfb7300a2bc744cbb70464528801a3d76"
# The model the Merchants page's "Suggest categories" asks.
GEMINI_MODEL = "gemini-2.5-flash"

# Secret: GEMINI_API_KEY    (npx wrangler secret put GEMINI_API_KEY)
